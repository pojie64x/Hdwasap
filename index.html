<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Status Drop</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f7f5;--card:#fff;--tx:#10201a;--mut:#667a71;--g:#25d366;--gd:#128c7e;--bd:#dfe8e3}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0b141a;--card:#16222a;--tx:#e8f1ed;--mut:#8aa097;--bd:#243640}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0b141a;--card:#16222a;--tx:#e8f1ed;--mut:#8aa097;--bd:#243640}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:480px;margin:0 auto;padding:16px}
h1{font-size:24px;margin:8px 0 2px;display:flex;align-items:center;gap:8px}
h1 span{background:var(--g);color:#fff;border-radius:10px;padding:2px 8px;font-size:13px}
p.sub{color:var(--mut);margin:0 0 16px;font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.pick{display:block;text-align:center;border:2px dashed var(--g);border-radius:16px;padding:28px 12px;cursor:pointer;color:var(--gd);font-weight:600}
.pick input{display:none}
video{width:100%;border-radius:12px;background:#000;max-height:260px}
label{font-size:13px;color:var(--mut);display:block;margin:10px 0 6px}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:10px 0;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-weight:600;font-size:14px}
.seg button.on{background:var(--g);color:#fff;border-color:var(--g)}
.go{width:100%;margin-top:14px;padding:14px;border:0;border-radius:14px;background:var(--g);color:#fff;font-size:16px;font-weight:700}
.go:disabled{opacity:.5}
.info{font-size:13px;color:var(--mut);margin-top:10px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;width:0;background:var(--g);transition:width .2s}
.part{display:flex;flex-direction:column;gap:8px}
.part h3{margin:0;font-size:15px}
.row{display:flex;gap:8px}
.row a,.row button{flex:1;text-align:center;padding:10px;border-radius:10px;border:1px solid var(--g);color:var(--gd);background:transparent;font-weight:600;text-decoration:none;font-size:14px}
.row .share{background:var(--g);color:#fff}
.note{font-size:12px;color:var(--mut);margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Status Drop <span>HD</span></h1>
  <p class="sub">Split any long video into WhatsApp Status clips, keeping the quality high.</p>

  <label class="pick" id="pick">📹 Tap to choose a video<input type="file" id="file" accept="video/*"></label>

  <div id="panel" hidden>
    <div class="card">
      <video id="prev" controls playsinline></video>
      <label>Clip length</label>
      <div class="seg" id="lenSeg">
        <button data-v="30" class="on">30 sec</button><button data-v="60">60 sec</button><button data-v="15">15 sec</button>
      </div>
      <label>Resolution</label>
      <div class="seg" id="qSeg">
        <button data-v="480">480p</button><button data-v="720">720p</button><button data-v="1080" class="on">1080p</button><button data-v="0">Original</button>
      </div>
      <label>Bitrate: <b id="brV">9 Mbps</b></label>
      <input type="range" id="brR" min="1" max="25" step="0.5" value="9" style="width:100%;accent-color:#25d366">
      <label>Frame rate</label>
      <div class="seg" id="fSeg">
        <button data-v="30" class="on">30 fps</button><button data-v="60">60 fps</button>
      </div>
      <div class="info" id="info"></div>
      <button class="go" id="go">Create status clips</button>
      <div class="bar" id="bar" hidden><i id="fill"></i></div>
      <div class="info" id="stat"></div>
    </div>
    <div id="out"></div>
  </div>
  <div class="note">Clips are encoded as real H.264/AAC MP4 files in real time, so keep this tab open until it finishes. Needs Chrome or Edge.</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.js"></script>
<script>
const $=id=>document.getElementById(id);
let len=30,br=9e6,fps=30,res=1080,dur=0,url=null,busy=false,fileName="video",curFile=null;
function seg(id,cb){$(id).onclick=e=>{const b=e.target.closest("button");if(!b)return;
  [...$(id).children].forEach(x=>x.classList.remove("on"));b.classList.add("on");cb(+b.dataset.v);upd();};}
function setBr(m){br=m*1e6;$("brV").textContent=m+" Mbps"}
seg("lenSeg",v=>len=v);seg("fSeg",v=>fps=v);seg("qSeg",v=>res=v);
$("brR").oninput=e=>setBr(+e.target.value);
function parts(){return dur?Math.max(1,Math.ceil((dur-0.5)/len)):0}
function upd(){if(dur)$("info").textContent=`Length ${fmt(dur)} → ${parts()} clip${parts()>1?"s":""} of ${len}s`}
function fmt(s){s=Math.round(s);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}

$("file").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  if(url)URL.revokeObjectURL(url);
  curFile=f;url=URL.createObjectURL(f);fileName=f.name.replace(/\.[^.]+$/,"");
  const v=$("prev");v.src=url;
  v.onloadedmetadata=()=>{dur=v.duration;$("panel").hidden=false;$("out").innerHTML="";$("stat").textContent="";$("bar").hidden=true;upd();};
};

async function getAudio(){
  try{
    const ac=new (window.AudioContext||window.webkitAudioContext)({sampleRate:48000});
    const buf=await ac.decodeAudioData(await curFile.arrayBuffer());
    ac.close();return buf;
  }catch(e){return null}
}

async function encodePart(v,abuf,start,end,onp){
  const sc=res?Math.min(1,res/Math.min(v.videoWidth,v.videoHeight)):1;
  const W=Math.round(v.videoWidth*sc/2)*2,H=Math.round(v.videoHeight*sc/2)*2;
  const acfg={codec:"mp4a.40.2",sampleRate:48000,numberOfChannels:2,bitrate:192000};
  const useA=!!(abuf&&window.AudioEncoder&&(await AudioEncoder.isConfigSupported(acfg)).supported);
  let vcfg=null;
  for(const cd of ["avc1.4d002a","avc1.64002a","avc1.42002a","avc1.4d0033","avc1.640033"]){
    const t={codec:cd,width:W,height:H,bitrate:br,framerate:fps,avc:{format:"avc"}};
    try{if((await VideoEncoder.isConfigSupported(t)).supported){vcfg=t;break}}catch(e){}
  }
  if(!vcfg)throw new Error("H.264 encoding isn't supported here. Try Chrome.");
  const target=new Mp4Muxer.ArrayBufferTarget();
  const muxer=new Mp4Muxer.Muxer({target,fastStart:"in-memory",firstTimestampBehavior:"offset",
    video:{codec:"avc",width:W,height:H,frameRate:fps},
    ...(useA?{audio:{codec:"aac",numberOfChannels:2,sampleRate:48000}}:{})});
  let err=null;
  const ve=new VideoEncoder({output:(c,m)=>muxer.addVideoChunk(c,m),error:e=>err=e});
  ve.configure(vcfg);
  const c=document.createElement("canvas");c.width=W;c.height=H;const cx=c.getContext("2d");
  v.pause();v.currentTime=start;
  await new Promise(r=>{v.onseeked=r});
  const span=end-start;
  await new Promise(async done=>{
    let last=-1,n=0;
    const tick=()=>{
      const t=v.currentTime-start;
      if(t>=span-0.02||v.ended){v.pause();done();return}
      if((last<0||t-last>=0.95/fps)&&v.readyState>=2){
        cx.drawImage(v,0,0,W,H);
        const f=new VideoFrame(c,{timestamp:Math.round(t*1e6)});
        if(ve.encodeQueueSize<20)ve.encode(f,{keyFrame:n%(fps*2)===0});
        f.close();last=t;n++;
      }
      onp(t/span);
      requestAnimationFrame(tick);
    };
    await v.play();tick();
  });
  if(useA){
    const ae=new AudioEncoder({output:(c,m)=>muxer.addAudioChunk(c,m),error:e=>err=e});
    ae.configure(acfg);
    const sr=48000,s0=Math.floor(start*sr),s1=Math.min(abuf.length,Math.floor(end*sr));
    const L=abuf.getChannelData(0),R=abuf.numberOfChannels>1?abuf.getChannelData(1):L;
    for(let i=s0;i<s1;i+=sr){
      const k=Math.min(sr,s1-i),d=new Float32Array(k*2);
      d.set(L.subarray(i,i+k),0);d.set(R.subarray(i,i+k),k);
      ae.encode(new AudioData({format:"f32-planar",sampleRate:sr,numberOfFrames:k,numberOfChannels:2,timestamp:Math.round((i-s0)/sr*1e6),data:d}));
    }
    await ae.flush();ae.close();
  }
  await ve.flush();ve.close();
  if(err)throw err;
  muxer.finalize();
  return new Blob([target.buffer],{type:"video/mp4"});
}

$("go").onclick=async()=>{
  if(busy)return;
  if(!window.VideoEncoder||!window.Mp4Muxer){alert("This browser can't encode video. Try Chrome or Edge.");return}
  busy=true;$("go").disabled=true;$("out").innerHTML="";$("bar").hidden=false;$("fill").style.width="0";
  const v=$("prev");v.controls=false;v.muted=true;
  $("stat").textContent="Reading audio…";
  const abuf=await getAudio();
  const total=parts();let ok=true;
  for(let i=0;i<total;i++){
    const s=i*len,e=Math.min(dur,s+len);
    $("stat").textContent=`Encoding clip ${i+1} of ${total}…`;
    try{
      const blob=await encodePart(v,abuf,s,e,p=>{$("fill").style.width=((i+Math.min(1,p))/total*100)+"%"});
      addPart(blob,i+1);
    }catch(err){ok=false;$("stat").textContent="Something went wrong: "+(err.message||err);break}
  }
  if(ok){$("fill").style.width="100%";$("stat").textContent=`Done! ${total} clip${total>1?"s":""} ready 🎉`+(abuf?"":" (no audio could be read from this file)")}
  v.controls=true;v.muted=false;v.currentTime=0;busy=false;$("go").disabled=false;
};

function addPart(blob,n){
  const name=`${fileName}_part${n}.mp4`;
  const u=URL.createObjectURL(blob);
  const d=document.createElement("div");d.className="card part";
  d.innerHTML=`<h3>Part ${n} · ${(blob.size/1048576).toFixed(1)} MB</h3><video src="${u}" controls playsinline></video>
  <div class="row"><button class="share">Share to WhatsApp</button><a href="${u}" download="${name}">Save</a></div>`;
  d.querySelector(".share").onclick=async()=>{
    const file=new File([blob],name,{type:"video/mp4"});
    try{
      if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file],title:name});
      else alert("Sharing isn't available here. Use Save, or press and hold the video.");
    }catch(e){}
  };
  $("out").appendChild(d);
}
</script>
</body>
</html>
